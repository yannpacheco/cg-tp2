<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ilha do Contrabando</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="canvas" width="800" height="500" aria-label="Cena do diorama"></canvas>

  <!-- Menu sobre a cena, sem alterar o tamanho do canvas. -->
  <aside id="menu" aria-label="Controles do diorama">
    <h1>Ilha do Contrabando</h1>
    <p><kbd>1</kbd> Giro automático · scroll para zoom</p>
    <p><kbd>2</kbd> Orbital · arraste o mouse para girar</p>
    <p id="camera-status" role="status">Câmera 1: giro automático</p>
    <p><kbd>L</kbd> Ligar/desligar iluminação</p>
    <button id="toggle-light" type="button" aria-pressed="true" disabled>Desligar iluminação</button>
    <p><kbd>V</kbd> Vento nas palmeiras e poeira</p>
    <button id="toggle-wind" type="button" aria-pressed="true" disabled>Carregando vento...</button>
    <p id="status" role="status">Carregando WebGL...</p>
  </aside>

  <!-- TWGL auxilia as chamadas do WebGL. -->
  <script src="https://twgljs.org/dist/7.x/twgl-full.min.js"></script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
